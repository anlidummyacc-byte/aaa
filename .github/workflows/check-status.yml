name: Check OCI Status

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check status every minute
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 360); do
            DATA=$(curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?per_page=50")

            RUN=$(echo "$DATA" | jq -c \
              '[.workflow_runs[]
               | select(.name == "OCI Auto Provisioner (region from OCI_CONFIG)")]
               | sort_by(.created_at) | last // empty')

            if [ -z "$RUN" ]; then
              MSG="⚠️ OCI STATUS: No provisioning run found."
            else
              STATUS=$(echo "$RUN" | jq -r '.status')
              RESULT=$(echo "$RUN" | jq -r '.conclusion // "running"')

              if [ "$RESULT" = "success" ]; then
                echo "✅ Provisioning succeeded. Stopping checks."
                exit 0
              elif [ "$STATUS" = "in_progress" ]; then
                MSG="⏳ OCI UPDATE: Provisioning is still running. No confirmed success yet."
              elif [ "$RESULT" = "failure" ]; then
                MSG="⚠️ OCI UPDATE: Provisioning failed. No confirmed success yet."
              else
                MSG="ℹ️ OCI UPDATE: Latest run status is $STATUS, result is $RESULT."
              fi
            fi

            echo "$MSG"

            if [ -n "$WEBHOOK_URL" ]; then
              case "$WEBHOOK_URL" in
                *macrodroid.com*)
                  curl -fsS -m 15 -G \
                    --data-urlencode "event=status" \
                    --data-urlencode "msg=$MSG" \
                    "$WEBHOOK_URL" || true
                  ;;
                *)
                  curl -fsS -m 15 \
                    -H 'Content-Type: application/json' \
                    -d "$(jq -n --arg m "$MSG" '{content:$m,text:$m}')" \
                    "$WEBHOOK_URL" || true
                  ;;
              esac
            fi

            sleep 60
          done
