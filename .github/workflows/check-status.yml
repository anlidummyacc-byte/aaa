```yaml
name: Check provisioner status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/2 * * * *"

permissions:
  actions: read
  contents: read

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - name: Check latest workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh run list \
            --repo "$REPO" \
            --limit 10 \
            --json name,status,conclusion,updatedAt \
            --jq '.[] | select(.name != "Check provisioner status") | [.name, .status, (.conclusion // "none"), .updatedAt] | @tsv'
```
